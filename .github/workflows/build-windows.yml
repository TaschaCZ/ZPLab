name: Build Windows (fork, unsigned)

# Builds a Windows NSIS installer without the upstream updater signing key.
# Run it from the Actions tab ("Run workflow"); the .exe lands in the run's
# artifacts as ZPLab-windows.

on:
  workflow_dispatch:
  push:
    branches: [feature/rfid-write]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: pnpm install --frozen-lockfile

      # Updater artifacts need the upstream private key; a fork has none.
      - name: build installer
        shell: bash
        run: pnpm tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v7
        with:
          name: ZPLab-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
